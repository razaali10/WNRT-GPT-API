openapi: 3.0.0
info:
  title: WNTR GPT API
  version: 1.0.0
paths:
  /simulateFromTextJson:
    post:
      summary: Simulate EPANET .inp file from JSON input
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inp_content:
                  type: string
                  description: The full .inp file content as plain text
                simulation_type:
                  type: string
                  enum: [EPANET, WNTR]
      responses:
        '200':
          description: Successful simulation
          content:
            application/json:
              schema:
                type: object
                properties:
                  pressure:
                    type: object
                  demand:
                    type: object
        '400':
          description: Missing or invalid input
        '500':
          description: Internal error




