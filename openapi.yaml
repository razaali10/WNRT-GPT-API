openapi: 3.1.0
info:
  title: WNTR GPT Simulation API
  version: 2.0.0

servers:
  - url: https://wnrt-gpt-api.onrender.com

paths:
  /simulateFromText:
    post:
      operationId: runSimulationFromText
      summary: Simulate a water network from an uploaded .inp file or text content.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                inp_file:
                  type: string
                  format: binary
                  description: "Upload a .inp file for simulation"
                inp_content:
                  type: string
                  description: "Paste .inp file content as text (alternative to file upload)"
                simulation_type:
                  type: string
                  enum: ["EPANET", "WNTR"]
                  default: "EPANET"
                duration:
                  type: integer
                  default: 24
                hydraulic_timestep:
                  type: integer
                  default: 60
                demand_model:
                  type: string
                  enum: ["PDD", "CDD"]
                  default: "PDD"
                report_status:
                  type: string
                  enum: ["YES", "NO"]
                  default: "NO"
      responses:
        '200':
          description: Simulation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  pressure:
                    type: object
                  demand:
                    type: object

  /simulateDisaster:
    post:
      operationId: simulateDisasterScenario
      summary: Simulate a pipe break or node closure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inp_content:
                  type: string
                failure_element:
                  type: string
                failure_type:
                  type: string
                  enum: ["pipe_break", "node_closure"]
                simulation_hours:
                  type: integer
      responses:
        '200':
          description: Failure simulation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  pressure:
                    type: object
                  demand:
                    type: object

  /simulateWaterQuality:
    post:
      operationId: simulateWaterQuality
      summary: Simulate water age or source tracing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inp_content:
                  type: string
                quality_type:
                  type: string
                  enum: ["age", "trace"]
                trace_node:
                  type: string
                duration:
                  type: integer
      responses:
        '200':
          description: Water quality results
          content:
            application/json:
              schema:
                type: object
                properties:
                  quality_type:
                    type: string
                  result:
                    type: object

  /analyze:
    post:
      operationId: runAdvancedAnalysis
      summary: Analyze resilience or morphology of a simulated network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                analysis_type:
                  type: string
                  enum: ["Resilience", "Morphology"]
                simulation_results:
                  type: object
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string

  /economicLoss:
    post:
      operationId: estimateEconomicLoss
      summary: Estimate economic impact of demand loss.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inp_content:
                  type: string
                duration:
                  type: integer
      responses:
        '200':
          description: Economic loss estimate
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_loss:
                    type: number
                  loss_by_node:
                    type: object

  /criticality:
    post:
      operationId: runCriticalityAnalysis
      summary: Analyze criticality of pipes by demand impact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inp_content:
                  type: string
                scenario_type:
                  type: string
      responses:
        '200':
          description: Pipe-level criticality results
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipe_demand_shortage:
                    type: object

  /plotNetwork:
    post:
      operationId: plotNetwork
      summary: Return base64-encoded network layout image.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                inp_content:
                  type: string
      responses:
        '200':
          description: Base64 PNG of the plotted network
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_base64:
                    type: string

  /ask:
    post:
      operationId: askGptAssistant
      summary: Interpret simulation results using GPT-4.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_question:
                  type: string
                pressure_summary:
                  type: string
                demand_summary:
                  type: string
      responses:
        '200':
          description: GPT-generated interpretation
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string



